<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D50FF"/>
      <stop offset="1" stop-color="#0B38EF"/>
    </linearGradient>
  </defs>

  <!-- rounded app-tile background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- W -->
  <polyline points="84,150 158,320 232,192 306,320 380,164"
            fill="none" stroke="#FFFFFF" stroke-width="46"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- heartbeat tail flowing off the last peak -->
  <polyline points="382,168 404,214 426,150 452,256 470,192 480,192"
            fill="none" stroke="#FFFFFF" stroke-width="19"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- trailing pulse dot -->
  <circle cx="488" cy="192" r="11" fill="#FFFFFF"/>

  <!-- wordmark -->
  <text x="252" y="424" fill="#FFFFFF" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="96" font-weight="700" text-anchor="middle" letter-spacing="1">Wavify</text>
</svg>
